<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Scanner QR - Generus Kuningan
  </title>


  <!--
    Html5Qrcode
  -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #fdf2f8
        );

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;
    }


    .scanner-container {

      width: 100%;

      max-width: 480px;

      background: #ffffff;

      border-radius: 20px;

      padding: 24px;

      box-shadow:
        0 15px 40px
        rgba(15, 23, 42, 0.12);

      text-align: center;
    }


    h1 {

      margin:
        0 0 8px;

      font-size: 24px;

      color: #111827;
    }


    .subtitle {

      margin:
        0 0 20px;

      color: #64748b;

      font-size: 14px;

      line-height: 1.5;
    }


    #reader {

      width: 100%;

      min-height: 280px;

      border:
        2px solid #e2e8f0;

      border-radius: 16px;

      overflow: hidden;

      background: #f8fafc;
    }


    #status {

      margin-top: 16px;

      padding: 12px;

      border-radius: 10px;

      background: #eff6ff;

      color: #1d4ed8;

      font-size: 14px;

      line-height: 1.5;
    }


    #result {

      margin-top: 12px;

      padding: 14px;

      border-radius: 10px;

      background: #ecfdf5;

      color: #047857;

      font-size: 15px;

      font-weight: 600;

      display: none;
    }


    .button {

      width: 100%;

      border: none;

      border-radius: 10px;

      padding: 13px 16px;

      margin-top: 14px;

      background: #2563eb;

      color: #ffffff;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;
    }


    .button:hover {

      background: #1d4ed8;
    }


    .button:disabled {

      background: #94a3b8;

      cursor: not-allowed;
    }

  </style>

</head>


<body>


  <div class="scanner-container">

    <h1>
      Scan QR Kehadiran
    </h1>

    <p class="subtitle">
      Arahkan kamera ke QR Code peserta.
    </p>


    <!--
      AREA SCANNER
    -->

    <div id="reader"></div>


    <!--
      STATUS
    -->

    <div id="status">
      Menyiapkan kamera...
    </div>


    <!--
      HASIL SCAN
    -->

    <div id="result"></div>


    <!--
      TOMBOL MULAI ULANG
    -->

    <button
      id="restartButton"
      class="button"
      type="button"
      style="display:none;"
    >
      Aktifkan Kamera Lagi
    </button>

  </div>


  <script>

    /*
     * ========================================================
     * KONFIGURASI
     * ========================================================
     */

    let scanner = null;

    let scanning = false;

    let processing = false;


    /*
     * ========================================================
     * ELEMENT
     * ========================================================
     */

    const statusElement =
      document.getElementById('status');

    const resultElement =
      document.getElementById('result');

    const restartButton =
      document.getElementById('restartButton');


    /*
     * ========================================================
     * STATUS HELPER
     * ========================================================
     */

    function setStatus(message) {

      statusElement.textContent =
        message;
    }


    function showResult(message) {

      resultElement.textContent =
        message;

      resultElement.style.display =
        'block';
    }


    function hideResult() {

      resultElement.style.display =
        'none';
    }


    /*
     * ========================================================
     * KIRIM DATA KE GOOGLE APPS SCRIPT
     * ========================================================
     *
     * Tetap menggunakan postMessage.
     * Jangan dihapus karena halaman utama
     * membutuhkan ID hasil scan.
     * ========================================================
     */

    function sendToParent(idPeserta) {

      try {

        window.parent.postMessage(

          {
            type:
              'QR_SCAN_RESULT',

            idPeserta:
              String(idPeserta).trim()
          },

          '*'
        );


        setStatus(
          'QR berhasil dibaca. Mengirim data...'
        );


        showResult(
          'ID Peserta: ' +
          String(idPeserta).trim()
        );


      } catch (error) {

        console.error(
          'Gagal mengirim hasil scan:',
          error
        );

        setStatus(
          'QR terbaca, tetapi gagal mengirim data.'
        );
      }
    }


    /*
     * ========================================================
     * QR BERHASIL DIBACA
     * ========================================================
     */

    async function onScanSuccess(
      decodedText,
      decodedResult
    ) {

      if (processing) {
        return;
      }


      processing = true;


      const idPeserta =
        String(
          decodedText || ''
        ).trim();


      if (!idPeserta) {

        processing = false;

        return;
      }


      console.log(
        'QR SCAN:',
        idPeserta
      );


      /*
       * Hentikan scanner sebentar
       * supaya QR tidak terbaca berkali-kali.
       */

      try {

        if (
          scanner &&
          scanning
        ) {

          await scanner.stop();

          scanning = false;
        }

      } catch (error) {

        console.warn(
          'Scanner stop:',
          error
        );
      }


      sendToParent(
        idPeserta
      );


      /*
       * Beri waktu halaman utama
       * memproses hasil scan.
       */

      setTimeout(
        () => {

          processing = false;

        },
        1500
      );
    }


    /*
     * ========================================================
     * QR ERROR
     * ========================================================
     *
     * Tidak menampilkan error setiap frame.
     * Karena Html5Qrcode memang memanggil callback
     * error berkali-kali ketika belum menemukan QR.
     * ========================================================
     */

    function onScanFailure(error) {

      /*
       * Sengaja dikosongkan.
       *
       * Jangan menampilkan "kamera error"
       * setiap kali QR belum terbaca.
       */
    }


    /*
     * ========================================================
     * CEK MEDIA DEVICES
     * ========================================================
     */

    function isCameraSupported() {

      return !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      );
    }


    /*
     * ========================================================
     * REQUEST CAMERA PERMISSION
     * ========================================================
     */

    async function requestCameraPermission() {

      if (
        !isCameraSupported()
      ) {

        throw new Error(
          'Browser tidak mendukung akses kamera.'
        );
      }


      const stream =
        await navigator.mediaDevices.getUserMedia(
          {
            video: {
              facingMode: {
                ideal: 'environment'
              }
            },

            audio: false
          }
        );


      /*
       * Kita hanya meminta permission.
       * Setelah itu stream ditutup karena Html5Qrcode
       * akan membuka kamera sendiri.
       */

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );
    }


    /*
     * ========================================================
     * MENCARI CAMERA
     * ========================================================
     */

    async function getCameraId() {

      const cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'Kamera tidak ditemukan oleh browser.'
        );
      }


      console.log(
        'Camera list:',
        cameras
      );


      /*
       * Cari kamera belakang.
       */

      const backCamera =
        cameras.find(
          camera => {

            const label =
              String(
                camera.label || ''
              ).toLowerCase();

            return (
              label.includes('back') ||
              label.includes('rear') ||
              label.includes('environment') ||
              label.includes('belakang')
            );
          }
        );


      /*
       * Kalau kamera belakang tidak ditemukan,
       * gunakan kamera pertama.
       */

      return (
        backCamera
          ? backCamera.id
          : cameras[0].id
      );
    }


    /*
     * ========================================================
     * START SCANNER
     * ========================================================
     */

    async function startScanner() {

      if (scanning) {
        return;
      }


      hideResult();

      restartButton.style.display =
        'none';


      try {

        setStatus(
          'Meminta izin kamera...'
        );


        /*
         * STEP 1
         * Request permission terlebih dahulu.
         */

        await requestCameraPermission();


        setStatus(
          'Mencari kamera...'
        );


        /*
         * STEP 2
         * Setelah permission diberikan,
         * baru cari device kamera.
         */

        const cameraId =
          await getCameraId();


        console.log(
          'Camera ID:',
          cameraId
        );


        /*
         * STEP 3
         * Buat scanner baru.
         */

        if (scanner) {

          try {

            await scanner.clear();

          } catch (error) {

            console.warn(
              'Scanner clear:',
              error
            );
          }
        }


        scanner =
          new Html5Qrcode(
            'reader'
          );


        /*
         * STEP 4
         * Jalankan kamera berdasarkan ID.
         */

        await scanner.start(

          cameraId,

          {

            fps:
              10,

            qrbox: {

              width:
                250,

              height:
                250
            },

            aspectRatio:
              1.0,

            disableFlip:
              false
          },

          onScanSuccess,

          onScanFailure
        );


        scanning =
          true;


        setStatus(
          'Kamera aktif. Arahkan QR Code ke kotak scanner.'
        );


      } catch (error) {

        console.error(
          'Camera initialization error:',
          error
        );


        scanning =
          false;


        let message =
          'Kamera tidak dapat digunakan.';


        /*
         * Permission ditolak
         */

        if (
          error &&
          (
            error.name ===
              'NotAllowedError' ||

            error.name ===
              'PermissionDeniedError'
          )
        ) {

          message =
            'Izin kamera ditolak. Izinkan akses kamera pada browser lalu tekan "Aktifkan Kamera Lagi".';
        }


        /*
         * Tidak ada device kamera
         */

        else if (
          error &&
          error.name ===
            'NotFoundError'
        ) {

          message =
            'Kamera tidak ditemukan pada perangkat ini.';
        }


        /*
         * HTTPS / secure context
         */

        else if (
          !window.isSecureContext
        ) {

          message =
            'Kamera membutuhkan HTTPS. Pastikan halaman dibuka melalui GitHub Pages HTTPS.';
        }


        /*
         * Error umum
         */

        else if (
          error &&
          error.message
        ) {

          message =
            error.message;
        }


        setStatus(
          message
        );


        restartButton.style.display =
          'block';
      }
    }


    /*
     * ========================================================
     * RESTART BUTTON
     * ========================================================
     */

    restartButton.addEventListener(
      'click',
      () => {

        startScanner();

      }
    );


    /*
     * ========================================================
     * CEK SAAT HALAMAN DIBUKA
     * ========================================================
     */

    window.addEventListener(
      'load',
      () => {

        if (
          !window.isSecureContext
        ) {

          setStatus(
            'Halaman scanner harus dibuka melalui HTTPS.'
          );

          restartButton.style.display =
            'block';

          return;
        }


        if (
          !isCameraSupported()
        ) {

          setStatus(
            'Browser ini tidak mendukung akses kamera.'
          );

          restartButton.style.display =
            'block';

          return;
        }


        startScanner();

      }
    );


    /*
     * ========================================================
     * PAGE VISIBILITY
     * ========================================================
     *
     * Kalau user kembali ke halaman scanner
     * setelah izin kamera berubah, scanner bisa
     * diaktifkan kembali.
     * ========================================================
     */

    document.addEventListener(
      'visibilitychange',
      () => {

        if (
          document.visibilityState ===
          'visible'
        ) {

          if (
            !scanning &&
            !processing
          ) {

            /*
             * Jangan otomatis membuka permission
             * berkali-kali. User bisa menekan tombol
             * bila diperlukan.
             */
          }
        }
      }
    );

  </script>

</body>

</html>
